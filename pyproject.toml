[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leaderboard-audit"
version = "0.1.0"
description = "Run an evaluation and audit how much of its ordering the data supports"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Vahit FERYAD", email = "vahit.feryat@gmail.com" }]
keywords = ["evaluation", "benchmark", "leaderboard", "statistics",
            "reliability", "llm-evaluation", "statistical-power"]

# numpy runs the entire audit, including every statistical test. matplotlib is
# only used for the optional figure.
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
# Offline work -- audit, replay, simulation -- needs none of these.
live = ["requests>=2.25"]        # calling models through OpenRouter
hub = ["datasets>=2.0"]          # loading items from the Hugging Face hub
figures = ["matplotlib>=3.5"]    # the ranks figure; tables print without it

[project.scripts]
# Both names install. `la` is what the documentation uses; the long form
# exists so the command is discoverable from the package name alone.
la = "la.cli:main"
leaderboard-audit = "la.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
