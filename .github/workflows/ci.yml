# A repository about verifying results should verify its own.
#
# Three things are checked, and the third is the one that usually rots: that
# the commands printed in the README still work on a clean checkout with
# nothing installed. Tests passing locally while the quickstart is broken for
# every new reader is the failure this is here to catch.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # numpy alone runs the audit and every statistical test. matplotlib is
      # only needed for the figures, so it is installed separately below to
      # keep the no-extras path honest.
      - name: Install numpy only
        run: python -m pip install --upgrade pip numpy

      - name: Statistics
        run: python tests/test_stats.py

      - name: Audit
        run: python tests/test_audit.py

      - name: Measurement system
        run: python tests/test_system.py

      - name: Grader comparison
        run: python tests/test_compare.py

      # The quickstart, exactly as the README prints it. No key, no network.
      - name: README quickstart works with nothing installed
        run: python demo.py

      - name: README reproduce commands work with nothing installed
        run: |
          python la.py audit run_gsm8k_numeric/scores.csv --out /tmp/a1 --quiet
          python la.py compare run_gsm8k_numeric/scores.csv run_gsm8k_judge/scores.csv --out /tmp/a2 --quiet
        shell: bash

      - name: Installed entry point works
        run: |
          python -m pip install -e .
          la audit run_gsm8k_numeric/scores.csv --out audit_out --quiet
        shell: bash

      - name: Figures rebuild
        run: |
          python -m pip install matplotlib
          python figures/make_figures.py
        shell: bash

      # The published result must be reproducible from the shipped tables, or
      # the claim in the README is not checkable.
      - name: Published result still reproduces
        run: python tests/test_published.py
